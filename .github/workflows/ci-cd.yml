name: CI/CD Pipeline

on:
  push:
    branches: [dev, qa, main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Where to deploy (manual runs only)"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
          - prod_test
        default: dev

jobs:
  # lint:
